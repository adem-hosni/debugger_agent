[project]
name = "agent"
version = "0.1.0"
description = "Professional DeepAgents-based AI assistant with OpenRouter integration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.5.0",
    "langchain-openrouter>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "C4", "C90", "D", "T20", "PYI", "PT", "Q", "RUF"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D107", "T201"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/agent"]